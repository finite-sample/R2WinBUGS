name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    uses: gojiplus/r-canon/.github/workflows/reusable-check.yml@v2
    with:
      # BRugs (Suggests, needed only by openbugs()) is archived on CRAN.
      extra-packages: "any::rcmdcheck, BRugs=?ignore"
