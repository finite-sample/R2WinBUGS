name: test-coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  coverage:
    uses: gojiplus/r-canon/.github/workflows/reusable-coverage.yml@lint-coverage-extra-packages
    with:
      extra-packages: BRugs=?ignore
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
